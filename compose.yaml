# Run it with: docker compose up --build
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Fixed issuer so tokens read the same from the browser and from the agents.
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo ok >&3"]
      interval: 5s
      timeout: 5s
      retries: 40

  orchestrator:
    build: { context: ., dockerfile: orchestrator/Dockerfile }
    environment:
      KEYCLOAK_ISSUER: http://localhost:8081/realms/a2a-demo
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: a2a-demo
      ORCHESTRATOR_CLIENT_ID: orchestrator
      ORCHESTRATOR_SECRET: ${ORCHESTRATOR_SECRET:?set ORCHESTRATOR_SECRET in .env (see .env.example)}
      ORCHESTRATOR_BASE_URL: http://localhost:9001
      REPO_AGENT_INTERNAL_URL: http://repo-agent:9002
      REPO_AGENT_AUDIENCE: repo-agent
      SESSION_SECRET: ${SESSION_SECRET}
      ROGUE_CLIENT_ID: rogue-agent
      ROGUE_SECRET: rogue-dev-secret
      # Shared with repo-agent, which posts its Auth Arcade events to orchestrator.
      EVENTS_KEY: ${EVENTS_KEY:-dev-events-key}
    ports:
      - "9001:9001"
    depends_on:
      keycloak:
        condition: service_healthy

  repo-agent:
    build: { context: ., dockerfile: repo-agent/Dockerfile }
    environment:
      KEYCLOAK_ISSUER: http://localhost:8081/realms/a2a-demo
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: a2a-demo
      REPO_AGENT_AUDIENCE: repo-agent
      REPO_AGENT_BASE_URL: http://localhost:9002
      ALLOWED_CALLERS: orchestrator
      REQUIRED_SCOPE: github.act
      REPO_AGENT_TICKET_KEY: ${REPO_AGENT_TICKET_KEY:?set REPO_AGENT_TICKET_KEY in .env (see .env.example)}
      MCP_MODE: ${MCP_MODE:-mock}
      MCP_MOCK_URL: http://mockmcp:9003
      MCP_GITHUB_URL: https://api.githubcopilot.com/mcp/
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      # Where repo-agent sends its Auth Arcade events (see common/common/events.py).
      EVENTS_INGEST_URL: http://orchestrator:9001/events/ingest
      EVENTS_KEY: ${EVENTS_KEY:-dev-events-key}
    volumes:
      - repo-agent-data:/data
    ports:
      - "9002:9002"
    depends_on:
      keycloak:
        condition: service_healthy

  mockmcp:
    build: { context: ., dockerfile: mockmcp/Dockerfile }
    environment:
      MOCKMCP_BASE_URL: http://localhost:9003
      MOCKMCP_INTERNAL_URL: http://mockmcp:9003
    ports:
      - "9003:9003"

volumes:
  repo-agent-data:
